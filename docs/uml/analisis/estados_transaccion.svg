ont-size="12" lengthAdjust="spacing" textLength="203.1914" x="11" y="356.0234">entry / crear o actualizar la posici&#243;n</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="167.4961" x="11" y="370.543">entry / recalcular el portafolio</text></g><g id="Rechazada"><rect fill="#F1F1F1" height="51.459" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="233.3164" x="247" y="312.4395"/><line style="stroke:#181818;stroke-width:0.5;" x1="247" x2="480.3164" y1="339.3789" y2="339.3789"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="73.3359" x="326.9902" y="331.002">Rechazada</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="213.3164" x="252" y="356.0039">entry / registrar el motivo del rechazo</text></g><g id="Cancelada"><rect fill="#F1F1F1" height="65.9785" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="193.9121" x="498.5" y="304.9395"/><line style="stroke:#181818;stroke-width:0.5;" x1="498.5" x2="692.4121" y1="331.8789" y2="331.8789"/><text fill="#000000" font-family="Helvetica" font-size="14" lengthAdjust="spacing" textLength="70.2051" x="560.3535" y="323.502">Cancelada</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="143.8594" x="503.5" y="348.5039">entry / descartar la orden</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="173.9121" x="503.5" y="363.0234">(no afecta saldo ni posiciones)</text></g><ellipse cx="363.5" cy="59.9395" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><ellipse cx="363.5" cy="442.4395" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1;"/><ellipse cx="363.5" cy="442.4395" fill="#222222" rx="6" ry="6" style="stroke:#222222;stroke-width:1;"/><g class="entity" data-entity="GMN2" data-source-line="20" data-uid="ent0003" id="ent